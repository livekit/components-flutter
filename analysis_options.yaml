include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Xcode vendors Swift package checkouts under build when building the
    # example, livekit_client ships Package.swift since 2.10.0.
    - build/**
    - example/build/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

  errors:
    constant_identifier_names: ignore
    no_wildcard_variable_uses: ignore
    use_super_parameters: ignore
    avoid_print: ignore

linter:
  rules:
    # Preference of the SDK
    prefer_single_quotes: true
    prefer_final_locals: true
    unnecessary_brace_in_string_interps: false
    avoid_print: true
    depend_on_referenced_packages: true

    # Enforce this for correct async logic
    unawaited_futures: true
    discarded_futures: true

formatter:
  page_width: 120
  trailing_commas: preserve
