name: livekit_components
description: "Out-of-the-box flutter widgets for livekit client."
version: 1.3.0
homepage: https://github.com/livekit/components-flutter

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  livekit_client: ^2.9.0
  chat_bubbles: ^1.6.0
  collection: ^1.19.0
  flutter_background: ^1.3.0+1
  google_fonts: ^6.2.1
  intl: ^0.20.2
  provider: ^6.1.2
  responsive_builder: ^0.7.1

# Temporary until the typed screen share helpers ship in a livekit_client
# release, then this override goes away and the constraint above gets bumped.
dependency_overrides:
  livekit_client:
    git:
      url: https://github.com/livekit/client-sdk-flutter.git
      ref: release/v2.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  import_sorter: ^4.6.0

topics:
  - webrtc
  - artificial-intelligence
  - livestream
  - conference
  - agent
